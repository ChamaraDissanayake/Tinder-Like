<ion-header>
  <ion-navbar style="min-height:80px">
    <ion-grid>
      <ion-row>
        <ion-col>
          <img src="assets/imgs/profile.jpeg" style="width:60px;height:60px;border-radius:50%">
        </ion-col>
        <ion-col style="margin-top:10px">
          <div class="can-toggle">
            <div class="can-toggle demo-rebrand-2">
              <input id="e" type="checkbox">
              <label for="e">
                <div class="can-toggle__switch" data-checked="On" data-unchecked="No"
                  style="max-width:150px; max-height:50px"></div>
              </label>
            </div>
          </div>
        </ion-col>
        <ion-col text-right style="margin-top:-5px">
          <button ion-button icon-only large clear color="dark" (click)="chatm()">
            <ion-icon name="ios-text"></ion-icon>
          </button>
        </ion-col>
      </ion-row>
    </ion-grid>
  </ion-navbar>
</ion-header>

<ion-content padding>

  <div swing-stack #myswing1 [stackConfig]="stackConfig" (throwoutleft)="voteUp(false)" (throwoutright)="voteUp(true)"
    (throwoutup)="voteSuper(true)" (throwoutdown)="voteSuper(false)" id="card-stack" [style.zIndex]="-1">
    <ion-card #mycards1 swing-card *ngFor="let c of cards">
      <ion-item *ngIf="c.picture" style="position: absolute;">
        <!-- <ion-avatar item-left>
          <img *ngIf="c.picture" [src]="c.picture.medium">
        </ion-avatar>
        <h2>{{ c.name.first }} {{ c.name.last}}</h2>
        <p>{{ c.email }}</p> -->
        <img style="border-radius:10px; height: 400px;" [src]="c.picture.large">        
      </ion-item>
      <ion-item style="position: relative; background: unset;">
        <span class="response-label like-label">Like</span>
        <span class="response-label nope-label">Nope</span>
        <span class="response-label super-like-label">Super Like</span>
      </ion-item>

      <!-- <ion-card-content *ngIf="c.location">
        From: {{ c.location.city }}, {{ c.location.postcode }}<br>
        Phone: {{ c.phone }}
      </ion-card-content> -->

      <!-- <ion-row *ngIf="c.name">
        <ion-col>
          <button ion-button clear small icon-left color="primary" (click)="voteUp(true)">
            <ion-icon name="thumbs-up"></ion-icon>
            Yes
          </button>
        </ion-col>
        <ion-col>
          <button ion-button clear small icon-left color="primary" (click)="voteUp(false)">
            <ion-icon name="thumbs-down"></ion-icon>
            No
          </button>
        </ion-col>
      </ion-row> -->
    </ion-card>
  </div>
  <p style="text-align: center; width: 100%; margin-top: unset;">{{ recentCard }}</p>
  <div text-center style="bottom:10px;position:fixed; align-content:center">
    <ion-buttons text-center>
      <button (click)="prof()" ion-button icon-only outline color="cusyellow"
        style="width:50px;height:50px;border-radius:50%">
        <ion-icon name="md-refresh"></ion-icon>
      </button>
      <button ion-button icon-only outline color="danger" style="width:70px;height:70px;border-radius:50%">
        <ion-icon name="md-close"></ion-icon>
      </button>
      <button ion-button icon-only outline color="cuspurple" style="width:50px;height:50px;border-radius:50%"
        (click)="chatid()">
        <ion-icon name="md-flash"></ion-icon>
      </button>
      <button ion-button icon-only outline color="secondary" (click)="lgn()"
        style="width:70px;height:70px;border-radius:50%">
        <ion-icon name="md-heart"></ion-icon>
      </button>
      <button ion-button icon-only outline color="primary" style="width:50px;height:50px;border-radius:50%"
        (click)="pho()">
        <ion-icon name="md-star"></ion-icon>
      </button>
    </ion-buttons>
  </div>
</ion-content>
